<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)" />
  <circle cx="400" cy="225" r="280" fill="url(#glow)" />
  <g transform="translate(180, 120) scale(1.1)">
    <!-- Car silhouette path -->
    <path d="M40,160 L70,160 C75,140 95,125 115,125 C135,125 155,140 160,160 L240,160 C245,140 265,125 285,125 C305,125 325,140 330,160 L360,160 C370,160 380,150 380,140 L370,105 C365,95 340,75 300,70 L230,40 C210,30 170,30 140,40 L80,75 L40,95 C25,105 20,120 20,140 C20,150 30,160 40,160 Z" fill="none" stroke="url(#carGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Wheels -->
    <circle cx="115" cy="160" r="25" fill="#141923" stroke="url(#carGrad)" stroke-width="4" />
    <circle cx="115" cy="160" r="10" fill="url(#carGrad)" />
    <circle cx="285" cy="160" r="25" fill="#141923" stroke="url(#carGrad)" stroke-width="4" />
    <circle cx="285" cy="160" r="10" fill="url(#carGrad)" />
    <!-- Windows -->
    <path d="M145,48 L225,48 L285,75 L135,75 Z" fill="#0066FF" fill-opacity="0.2" stroke="url(#carGrad)" stroke-width="2" />
  </g>
  <text x="400" y="360" text-anchor="middle" fill="#8E9099" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="2">VEHICLEIQ INTELLIGENT MODEL SPECIFICATION</text>
</svg>
