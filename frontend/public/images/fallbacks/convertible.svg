<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>
    <linearGradient id="cabrioGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#232D3B" />
      <stop offset="50%" stop-color="#3C4B60" />
      <stop offset="100%" stop-color="#232D3B" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgGrad)" rx="12" stroke="#222D3D" stroke-width="1.5" />
  
  <ellipse cx="200" cy="180" rx="142" ry="10" fill="#05080D" opacity="0.85" />
  <line x1="40" y1="180" x2="360" y2="180" stroke="#222D3D" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Roll Hoops Behind Headrests -->
  <path d="M 160,116 C 160,105 174,105 174,116" stroke="#94A3B8" stroke-width="2.5" fill="none" />
  <path d="M 188,116 C 188,105 202,105 202,116" stroke="#94A3B8" stroke-width="2.5" fill="none" />

  <!-- Convertible Open Cockpit Silhouette -->
  <path d="M 58,150 
           L 155,142 
           C 158,130 168,126 178,126 
           L 225,126 
           L 245,100 
           L 260,102 
           L 252,130 
           L 322,132 
           L 358,140 
           C 366,144 368,150 364,156
           L 354,161 
           C 345,163 322,163 312,151
           C 302,139 276,139 266,151
           L 162,151
           C 152,139 126,139 116,151
           L 64,156
           Z" 
        fill="url(#cabrioGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Raked Front Windscreen -->
  <polygon points="244,101 258,103 248,130 232,130" fill="#0F172A" stroke="#38BDF8" stroke-width="1" opacity="0.85" />

  <!-- Interior Cockpit & Steering Wheel Hint -->
  <circle cx="218" cy="120" r="7" stroke="#64748B" stroke-width="1.5" fill="none" />
  <rect x="165" y="122" width="10" height="14" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <rect x="192" y="122" width="10" height="14" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1" />

  <!-- Wheels -->
  <circle cx="289" cy="154" r="22" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="289" cy="154" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="289" cy="154" r="5" fill="#E2E8F0" />
  
  <circle cx="139" cy="154" r="22" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="139" cy="154" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="139" cy="154" r="5" fill="#E2E8F0" />

  <!-- LED Accents -->
  <path d="M 352,143 L 365,148 L 350,150 Z" fill="#38BDF8" />
  <path d="M 62,148 L 56,152 L 65,153 Z" fill="#EF4444" />

  <text x="200" y="210" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="1.5" font-weight="600">
    OPEN-TOP CONVERTIBLE / ROADSTER
  </text>
</svg>
