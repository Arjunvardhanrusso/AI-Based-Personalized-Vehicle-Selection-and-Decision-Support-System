<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>
    <linearGradient id="coupeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222C3A" />
      <stop offset="50%" stop-color="#3A485C" />
      <stop offset="100%" stop-color="#222C3A" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgGrad)" rx="12" stroke="#222D3D" stroke-width="1.5" />
  
  <ellipse cx="200" cy="180" rx="142" ry="10" fill="#05080D" opacity="0.85" />
  <line x1="40" y1="180" x2="360" y2="180" stroke="#222D3D" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Aerodynamic Fastback Coupe Silhouette -->
  <!-- Low front nose, curved sweeping roofline that descends seamlessly into rear lip spoiler -->
  <path d="M 60,150 
           C 70,146 95,142 120,136 
           L 180,95 
           C 205,82 245,84 270,98 
           L 320,130 
           L 355,138 
           C 365,142 368,148 365,155
           L 355,160 
           C 345,163 322,163 312,150
           C 302,138 276,138 266,150
           L 162,150
           C 152,138 126,138 116,150
           L 65,156
           Z" 
        fill="url(#coupeGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Sweeping Frameless Coupe Windows -->
  <path d="M 185,100 L 265,100 L 305,128 L 140,128 Z" fill="#0F172A" stroke="#475569" stroke-width="1" opacity="0.9" />
  <!-- Single Door Pillar (Long door typical of coupe) -->
  <line x1="235" y1="100" x2="235" y2="128" stroke="#334155" stroke-width="1.5" />

  <!-- Low Profile Sport Wheels with Blue Rim Accent -->
  <circle cx="289" cy="153" r="22" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="289" cy="153" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="289" cy="153" r="5" fill="#E2E8F0" />
  
  <circle cx="139" cy="153" r="22" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="139" cy="153" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="139" cy="153" r="5" fill="#E2E8F0" />

  <!-- LED Projector & Aero Splitter -->
  <path d="M 350,141 L 364,146 L 348,149 Z" fill="#38BDF8" />
  <path d="M 64,148 L 56,151 L 65,153 Z" fill="#EF4444" />
  <line x1="330" y1="162" x2="362" y2="162" stroke="#64748B" stroke-width="2" />

  <text x="200" y="210" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="1.5" font-weight="600">
    SPORTS COUPE
  </text>
</svg>
