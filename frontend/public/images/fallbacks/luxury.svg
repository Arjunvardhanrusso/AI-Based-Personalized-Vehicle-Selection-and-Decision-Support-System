<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>
    <linearGradient id="luxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2633" />
      <stop offset="50%" stop-color="#344154" />
      <stop offset="100%" stop-color="#1E2633" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgGrad)" rx="12" stroke="#222D3D" stroke-width="1.5" />
  
  <ellipse cx="200" cy="180" rx="148" ry="10" fill="#05080D" opacity="0.85" />
  <line x1="30" y1="180" x2="370" y2="180" stroke="#222D3D" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Long Wheelbase Flagship Luxury Limousine Silhouette -->
  <path d="M 48,150 
           L 80,150 
           C 95,150 115,138 132,130 
           L 165,92 
           C 185,82 245,82 268,94 
           L 315,128 
           L 358,134 
           C 368,136 372,144 370,154
           L 362,160 
           C 354,163 330,163 320,150
           C 310,137 282,137 272,150
           L 155,150
           C 145,137 118,137 108,150
           L 54,156
           Z" 
        fill="url(#luxGrad)" stroke="url(#chromeGrad)" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Chrome Window Surround (Executive Greenhouse) -->
  <path d="M 168,96 L 264,96 L 305,126 L 140,126 Z" fill="#0F172A" stroke="url(#chromeGrad)" stroke-width="1.5" opacity="0.9" />
  <!-- Thick B-Pillar with Chrome Finish -->
  <line x1="216" y1="96" x2="216" y2="126" stroke="#94A3B8" stroke-width="3" />

  <!-- Chrome Waistline / Rocker Moulding -->
  <line x1="120" y1="148" x2="260" y2="148" stroke="url(#chromeGrad)" stroke-width="1.8" />

  <!-- Elegant Large Multi-Spoke Luxury Rims -->
  <circle cx="295" cy="154" r="22" fill="url(#wheelGrad)" stroke="#CBD5E1" stroke-width="3" />
  <circle cx="295" cy="154" r="14" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" />
  <circle cx="295" cy="154" r="5" fill="#F8FAFC" />
  
  <circle cx="132" cy="154" r="22" fill="url(#wheelGrad)" stroke="#CBD5E1" stroke-width="3" />
  <circle cx="132" cy="154" r="14" fill="#1E293B" stroke="#94A3B8" stroke-width="1.5" />
  <circle cx="132" cy="154" r="5" fill="#F8FAFC" />

  <!-- LED Matrix Headlight & Chrome Grille Highlight -->
  <path d="M 358,138 L 368,142 L 354,145 Z" fill="#38BDF8" />
  <line x1="368" y1="140" x2="370" y2="154" stroke="url(#chromeGrad)" stroke-width="3.5" />
  <path d="M 52,148 L 46,151 L 54,153 Z" fill="#EF4444" />

  <text x="200" y="210" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="1.5" font-weight="600">
    FLAGSHIP LUXURY SALOON
  </text>
</svg>
