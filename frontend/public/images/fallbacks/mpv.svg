<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>
    <linearGradient id="mpvGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#232D3B" />
      <stop offset="50%" stop-color="#3A4A60" />
      <stop offset="100%" stop-color="#232D3B" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgGrad)" rx="12" stroke="#222D3D" stroke-width="1.5" />
  
  <ellipse cx="200" cy="182" rx="146" ry="10" fill="#05080D" opacity="0.85" />
  <line x1="35" y1="182" x2="365" y2="182" stroke="#222D3D" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- MPV Monospace Long Cabin Silhouette -->
  <!-- 3-row seating elongated roofline, steep windshield slope connecting smoothly to hood -->
  <path d="M 62,152 
           C 65,138 72,112 85,90 
           C 95,78 240,78 268,84 
           L 326,126 
           C 346,132 358,140 360,154
           L 352,160 
           C 345,163 322,163 312,149
           C 302,136 274,136 264,149
           L 162,149
           C 152,136 124,136 114,149
           L 68,156
           Z" 
        fill="url(#mpvGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-linejoin="round" />

  <!-- 3-Row Panoramic Side Glass -->
  <path d="M 94,88 L 260,88 L 314,124 L 108,124 Z" fill="#0F172A" stroke="#475569" stroke-width="1" opacity="0.9" />
  <!-- Pillars for 3 rows -->
  <line x1="165" y1="88" x2="165" y2="124" stroke="#334155" stroke-width="2.5" />
  <line x1="215" y1="88" x2="215" y2="124" stroke="#334155" stroke-width="2.5" />

  <!-- Comfort Touring Wheels -->
  <circle cx="288" cy="154" r="22" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="288" cy="154" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="288" cy="154" r="5" fill="#E2E8F0" />
  
  <circle cx="138" cy="154" r="22" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="138" cy="154" r="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="138" cy="154" r="5" fill="#E2E8F0" />

  <!-- LED Accents -->
  <path d="M 345,140 L 358,145 L 342,148 Z" fill="#38BDF8" />
  <path d="M 68,145 L 60,149 L 70,150 Z" fill="#EF4444" />

  <text x="200" y="210" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="1.5" font-weight="600">
    MULTI-PURPOSE VEHICLE (MPV)
  </text>
</svg>
