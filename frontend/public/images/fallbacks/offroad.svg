<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>
    <linearGradient id="offroadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2A38" />
      <stop offset="50%" stop-color="#36465C" />
      <stop offset="100%" stop-color="#1F2A38" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgGrad)" rx="12" stroke="#222D3D" stroke-width="1.5" />
  
  <ellipse cx="200" cy="186" rx="146" ry="11" fill="#05080D" opacity="0.85" />
  <line x1="35" y1="186" x2="365" y2="186" stroke="#222D3D" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Rear Tailgate Mounted Spare Wheel (Iconic 4x4 signature) -->
  <circle cx="58" cy="132" r="22" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="58" cy="132" r="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />

  <!-- Boxy Rugged 4x4 Silhouette -->
  <path d="M 75,152 
           L 75,82 
           C 85,76 240,76 260,82 
           L 305,122 
           L 340,128 
           C 350,132 355,142 354,154
           L 346,160 
           C 340,163 315,163 305,146
           C 292,128 260,128 248,146
           L 155,146
           C 142,128 110,128 98,146
           L 78,154
           Z" 
        fill="url(#offroadGrad)" stroke="#F59E0B" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Flat Upright Windshield and Side Windows -->
  <path d="M 85,86 L 252,86 L 295,122 L 85,122 Z" fill="#0F172A" stroke="#475569" stroke-width="1" opacity="0.9" />
  <line x1="165" y1="86" x2="165" y2="122" stroke="#334155" stroke-width="2.5" />
  <line x1="225" y1="86" x2="225" y2="122" stroke="#334155" stroke-width="2.5" />

  <!-- Flared Rugged Wheel Arches & High Clearance -->
  <path d="M 242,148 C 248,124 298,124 306,148" stroke="#F59E0B" stroke-width="3" fill="none" />
  <path d="M 94,148 C 100,124 150,124 158,148" stroke="#F59E0B" stroke-width="3" fill="none" />

  <!-- Heavy Duty Rock Sliders -->
  <line x1="162" y1="156" x2="238" y2="156" stroke="#64748B" stroke-width="3.5" stroke-linecap="round" />

  <!-- Massive All-Terrain Wheels with Orange Caliper/Beadlock Ring -->
  <circle cx="276" cy="154" r="26" fill="url(#wheelGrad)" stroke="#475569" stroke-width="4" />
  <circle cx="276" cy="154" r="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
  <circle cx="276" cy="154" r="6" fill="#F8FAFC" />
  
  <circle cx="126" cy="154" r="26" fill="url(#wheelGrad)" stroke="#475569" stroke-width="4" />
  <circle cx="126" cy="154" r="16" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />
  <circle cx="126" cy="154" r="6" fill="#F8FAFC" />

  <!-- Round Classic Offroad Headlamp & Tail Lights -->
  <circle cx="340" cy="140" r="5" fill="#38BDF8" />
  <rect x="75" y="136" width="4" height="12" rx="2" fill="#EF4444" />

  <text x="200" y="214" text-anchor="middle" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="1.5" font-weight="600">
    PURPOSE-BUILT 4X4 OFFROAD
  </text>
</svg>
