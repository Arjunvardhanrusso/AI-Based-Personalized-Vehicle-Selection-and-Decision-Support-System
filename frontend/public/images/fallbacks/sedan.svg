<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>
    <linearGradient id="sedanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#222C3A" />
      <stop offset="50%" stop-color="#3A485C" />
      <stop offset="100%" stop-color="#222C3A" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgGrad)" rx="12" stroke="#222D3D" stroke-width="1.5" />
  
  <ellipse cx="200" cy="180" rx="142" ry="10" fill="#05080D" opacity="0.85" />
  <line x1="40" y1="180" x2="360" y2="180" stroke="#222D3D" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Classic 3-Box Sedan Silhouette -->
  <!-- Low front hood, swept roofline, notchback boot -->
  <path d="M 55,148 
           L 85,148 
           C 95,148 115,138 135,132 
           L 175,98 
           C 195,88 235,88 255,98 
           L 305,132 
           L 345,138 
           C 358,142 362,150 360,158
           L 350,163 
           C 342,165 318,165 308,152
           C 298,140 272,140 262,152
           L 162,152
           C 152,140 126,140 116,152
           L 60,158
           Z" 
        fill="url(#sedanGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Sedan Cabin Windows (Dual pane) -->
  <path d="M 178,102 L 252,102 L 292,130 L 148,130 Z" fill="#0F172A" stroke="#475569" stroke-width="1" opacity="0.9" />
  <line x1="216" y1="102" x2="216" y2="130" stroke="#334155" stroke-width="2" />

  <!-- Wheels (Lower sports sedan stance) -->
  <circle cx="285" cy="155" r="21" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="285" cy="155" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="285" cy="155" r="5" fill="#E2E8F0" />
  
  <circle cx="139" cy="155" r="21" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="139" cy="155" r="13" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="139" cy="155" r="5" fill="#E2E8F0" />

  <!-- LED Accents -->
  <path d="M 345,142 L 358,147 L 342,150 Z" fill="#38BDF8" />
  <path d="M 60,147 L 54,150 L 62,152 Z" fill="#EF4444" />

  <text x="200" y="210" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="1.5" font-weight="600">
    EXECUTIVE SEDAN
  </text>
</svg>
