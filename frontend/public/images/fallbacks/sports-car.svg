<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>
    <linearGradient id="sportGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="50%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgGrad)" rx="12" stroke="#222D3D" stroke-width="1.5" />
  
  <ellipse cx="200" cy="180" rx="146" ry="10" fill="#05080D" opacity="0.9" />
  <line x1="35" y1="180" x2="365" y2="180" stroke="#222D3D" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Rear Wing / Spoiler -->
  <path d="M 46,128 L 74,128 L 70,134 L 50,134 Z" fill="#F59E0B" />
  <line x1="55" y1="134" x2="57" y2="148" stroke="#4B5563" stroke-width="2.5" />
  <line x1="68" y1="134" x2="68" y2="148" stroke="#4B5563" stroke-width="2.5" />

  <!-- Aggressive Sports Silhouette -->
  <path d="M 50,152 
           C 65,147 90,143 118,138 
           L 182,90 
           C 205,78 245,80 270,94 
           L 326,128 
           L 364,136 
           C 372,140 374,147 370,154
           L 358,160 
           C 348,163 325,163 315,149
           C 305,136 276,136 266,149
           L 158,149
           C 148,136 120,136 110,149
           L 55,156
           Z" 
        fill="url(#sportGrad)" stroke="#F59E0B" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Low Slung Glass Canopy -->
  <path d="M 188,94 L 264,94 L 308,126 L 145,126 Z" fill="#0F172A" stroke="#475569" stroke-width="1" opacity="0.9" />

  <!-- Side Air Intake Scoop -->
  <polygon points="175,138 195,132 190,146 172,146" fill="#111827" stroke="#F59E0B" stroke-width="1" />

  <!-- Wheels (Performance Multi-spoke with Amber Calipers) -->
  <circle cx="290" cy="153" r="23" fill="url(#wheelGrad)" stroke="#4B5563" stroke-width="3" />
  <circle cx="290" cy="153" r="15" fill="#1F2937" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="290" cy="153" r="5" fill="#F3F4F6" />
  <!-- Brake caliper -->
  <path d="M 298,142 A 12 12 0 0 1 302,154" stroke="#F59E0B" stroke-width="4" fill="none" />

  <circle cx="134" cy="153" r="23" fill="url(#wheelGrad)" stroke="#4B5563" stroke-width="3" />
  <circle cx="134" cy="153" r="15" fill="#1F2937" stroke="#F59E0B" stroke-width="1.5" />
  <circle cx="134" cy="153" r="5" fill="#F3F4F6" />
  <!-- Brake caliper -->
  <path d="M 142,142 A 12 12 0 0 1 146,154" stroke="#F59E0B" stroke-width="4" fill="none" />

  <!-- LED Projector & Aero Front Splitter -->
  <path d="M 358,140 L 371,145 L 354,148 Z" fill="#38BDF8" />
  <line x1="340" y1="162" x2="376" y2="162" stroke="#F59E0B" stroke-width="2.5" />

  <text x="200" y="210" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="1.5" font-weight="600">
    HIGH PERFORMANCE SPORTS CAR
  </text>
</svg>
