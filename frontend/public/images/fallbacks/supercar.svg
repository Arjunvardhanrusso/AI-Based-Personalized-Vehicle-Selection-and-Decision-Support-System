<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>
    <linearGradient id="hyperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgGrad)" rx="12" stroke="#222D3D" stroke-width="1.5" />
  
  <ellipse cx="200" cy="180" rx="148" ry="10" fill="#05080D" opacity="0.9" />
  <line x1="30" y1="180" x2="370" y2="180" stroke="#222D3D" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- High Downforce Carbon Rear Wing -->
  <path d="M 40,120 L 78,122 L 72,128 L 44,127 Z" fill="#EF4444" />
  <line x1="56" y1="128" x2="60" y2="148" stroke="#64748B" stroke-width="3" />

  <!-- Extreme Wedge Mid-Engine Silhouette -->
  <path d="M 44,152 
           C 60,147 88,142 120,136 
           L 190,82 
           C 215,72 250,75 275,90 
           L 335,128 
           L 374,136 
           C 382,139 383,146 376,153
           L 364,159 
           C 352,162 328,162 318,148
           C 308,134 278,134 268,148
           L 155,148
           C 145,134 116,134 106,148
           L 50,156
           Z" 
        fill="url(#hyperGrad)" stroke="#EF4444" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Jet Fighter Style Canopy -->
  <path d="M 195,86 L 268,86 L 314,124 L 155,124 Z" fill="#0F172A" stroke="#EF4444" stroke-width="1" opacity="0.9" />

  <!-- Massive Mid-Engine Side Air Scoop -->
  <polygon points="160,144 195,126 215,126 180,144" fill="#020617" stroke="#EF4444" stroke-width="1.2" />

  <!-- Ultra-Low Stance Wheels (Red Calipers) -->
  <circle cx="293" cy="153" r="23" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="293" cy="153" r="15" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" />
  <circle cx="293" cy="153" r="5" fill="#F8FAFC" />
  <path d="M 302,142 A 12 12 0 0 1 306,154" stroke="#EF4444" stroke-width="4.5" fill="none" />

  <circle cx="131" cy="153" r="23" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3" />
  <circle cx="131" cy="153" r="15" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" />
  <circle cx="131" cy="153" r="5" fill="#F8FAFC" />
  <path d="M 140,142 A 12 12 0 0 1 144,154" stroke="#EF4444" stroke-width="4.5" fill="none" />

  <!-- Sharp LED Laser Headlight & Carbon Diffuser -->
  <path d="M 366,139 L 380,144 L 362,147 Z" fill="#38BDF8" />
  <line x1="344" y1="162" x2="382" y2="162" stroke="#EF4444" stroke-width="3" />
  <line x1="38" y1="160" x2="55" y2="160" stroke="#64748B" stroke-width="3" />

  <text x="200" y="210" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="1.5" font-weight="600">
    EXOTIC SUPERCAR / HYPERCAR
  </text>
</svg>
