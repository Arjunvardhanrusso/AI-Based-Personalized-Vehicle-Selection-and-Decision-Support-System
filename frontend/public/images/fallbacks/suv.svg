<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#141B26" />
    </linearGradient>
    <linearGradient id="suvGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#242E3D" />
      <stop offset="50%" stop-color="#38475C" />
      <stop offset="100%" stop-color="#242E3D" />
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D14" />
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#bgGrad)" rx="12" stroke="#222D3D" stroke-width="1.5" />
  
  <!-- Ground Shadow -->
  <ellipse cx="200" cy="184" rx="145" ry="11" fill="#05080D" opacity="0.85" />
  <line x1="35" y1="184" x2="365" y2="184" stroke="#222D3D" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  <!-- Roof Rails -->
  <rect x="155" y="70" width="115" height="3" rx="1.5" fill="#64748B" />
  <rect x="165" y="73" width="6" height="4" fill="#475569" />
  <rect x="255" y="73" width="6" height="4" fill="#475569" />

  <!-- SUV Tall Body Silhouette -->
  <path d="M 60,150 
           C 65,135 90,132 115,128 
           L 150,82 
           C 165,76 260,75 285,82 
           L 322,122 
           C 346,128 358,138 360,152
           L 352,159 
           C 345,162 320,162 310,147
           C 300,133 270,133 260,147
           L 160,147
           C 150,133 120,133 110,147
           L 68,155
           Z" 
        fill="url(#suvGrad)" stroke="#38BDF8" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Glass Greenhouse (High greenhouse with rear quarter glass) -->
  <path d="M 156,86 L 278,86 L 310,123 L 132,123 Z" fill="#0F172A" stroke="#475569" stroke-width="1" opacity="0.9" />
  <!-- Pillars -->
  <line x1="205" y1="86" x2="205" y2="123" stroke="#334155" stroke-width="2.5" />
  <line x1="250" y1="86" x2="250" y2="123" stroke="#334155" stroke-width="2.5" />

  <!-- Heavy Duty Wheels & High Stance -->
  <!-- Front Wheel -->
  <circle cx="285" cy="155" r="25" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3.5" />
  <circle cx="285" cy="155" r="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="285" cy="155" r="6" fill="#F8FAFC" />
  <!-- Rear Wheel -->
  <circle cx="135" cy="155" r="25" fill="url(#wheelGrad)" stroke="#475569" stroke-width="3.5" />
  <circle cx="135" cy="155" r="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
  <circle cx="135" cy="155" r="6" fill="#F8FAFC" />

  <!-- Underbody Skid Plate Accent -->
  <path d="M 180,154 L 240,154" stroke="#64748B" stroke-width="3" stroke-linecap="round" />

  <!-- LED Accents -->
  <path d="M 345,138 L 358,144 L 340,148 Z" fill="#38BDF8" />
  <path d="M 64,142 L 58,147 L 68,149 Z" fill="#EF4444" />

  <text x="200" y="212" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="1.5" font-weight="600">
    SPORT UTILITY VEHICLE (SUV)
  </text>
</svg>
